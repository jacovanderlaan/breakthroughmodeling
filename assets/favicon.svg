<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Breakthrough Modeling</title>
  <!--
    The mark: a square with its lower-right corner cut away on a true 45° line,
    and the gold diamond emerging through the gap. Source of truth for the
    geometry is W:/data/products/breakthroughmodeling/brand/logo/.

    This is the favicon build: stroke 26 rather than 16 and a 44-unit diamond,
    because at 16 px the display weights collapse and the diamond would render
    as a single gold pixel. Keep the rounded dark tile from the previous icon —
    it holds the shape together in a browser tab.
  -->
  <rect width="200" height="200" rx="44" fill="#0f172a"/>
  <g fill="none" stroke="#2563eb" stroke-width="26"
     stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M 140 40 L 40 40 L 40 140 L 100 140" />
    <path d="M 140 40 L 140 100" />
  </g>
  <rect x="132" y="132" width="40" height="40" fill="#b88a1b"
        transform="rotate(45 152 152)" />
</svg>
